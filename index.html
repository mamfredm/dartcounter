<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1612">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darts">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Dart Counter</title>
<style>
@font-face{font-family:'Anton';src:url('fonts/anton-latin.woff') format('woff');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url('fonts/inter-latin-var.woff') format('woff');font-weight:100 900;font-style:normal;font-display:swap}
:root{
  --bg:#0a1612; --low:#0d1b16; --surf:#13241e; --high:#192e26; --top:#213a30; --line:#2c443b;
  --brass:#e5a93c; --brass-hi:#f3ba4c; --ink:#1f1400;
  --text:#eef0e6; --muted:#8fa89c; --dim:#5f7a6e;
  --green:#27ae60; --green-bg:#10301f; --red:#b8352a;
  --display:'Anton','Impact','Arial Narrow',sans-serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --pw:480px;                                /* page width */
  --padh:34px;                               /* minimum keypad key height; keys stretch to fill the screen */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{display:flex;flex-direction:column;min-height:100dvh;margin:0;padding:0 env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 20px) env(safe-area-inset-left);overscroll-behavior-y:none}
button{-webkit-user-select:none;user-select:none}
#setup,#game{width:100%;max-width:var(--pw);margin:0 auto}
#game{flex:1;display:flex;flex-direction:column}
.board{flex:1;display:flex;flex-direction:column;min-height:0}
.col-b{flex:1;display:flex;flex-direction:column;min-height:0}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
button:disabled{opacity:.35;cursor:default}
.hidden{display:none!important}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.d{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.03em}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
.hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:rgba(10,22,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr h1{margin:0;font-size:clamp(24px,7.5vw,32px);line-height:1;color:var(--brass);font-family:var(--display);font-weight:400;letter-spacing:.03em;text-transform:uppercase}
.hdr .ic{width:40px;height:40px;display:grid;place-items:center;font-size:22px;border-radius:12px}
.hdr .ic:active{background:var(--high)}
.hdr .ht{text-align:center;min-width:0}
.hdr .ht small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.hdr .ht small:empty{display:none}
.hdr .sp{min-width:40px;display:flex;justify-content:flex-end}
.nb{padding:8px 10px;border-radius:10px;background:var(--high);border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}

.wrap{padding:14px}
#setup{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start}
#setup>.card,#setup>.two{margin:0}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card .t{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;min-height:22px}
.card .t b{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.card .t b svg{color:var(--brass);font-size:16px}
.card .t span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .t span.g{color:var(--green)}

.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:52px;border-radius:12px;background:var(--high);color:var(--muted);font-family:var(--display);font-size:clamp(19px,6.4vw,26px);letter-spacing:.03em;text-transform:uppercase;transition:transform .05s}
.seg.sm button{min-height:46px;font-size:22px}
.seg button.on{background:var(--brass);color:var(--ink)}
.seg button:active{transform:translateY(2px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .card{margin:0}
.two .seg{gap:6px}
.two .seg button{min-height:46px;font-size:clamp(18px,5.6vw,22px);border-radius:10px}

.roster{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:10px;background:var(--high);border-radius:14px;padding:8px 10px}
.rrow .b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-family:var(--display);font-size:18px;flex:none}
.rrow:first-child .b{background:var(--brass);color:var(--ink)}
.rrow input{display:block;width:100%;min-width:0;background:none;border:0;color:var(--text);font:600 17px var(--sans);padding:8px 0;outline:0}
.rrow input::placeholder{color:var(--dim)}
.rrow small{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rrow:first-child small{color:var(--brass)}
.rrow .fl{flex:1;min-width:0}
.swap{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);background:var(--high);padding:7px 10px;border-radius:10px}

.cta{width:100%;min-height:60px;border-radius:14px;background:var(--brass);color:var(--ink);font-family:var(--display);font-size:26px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 0 #8a6218;transition:transform .05s,box-shadow .05s}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6218}
.cta.alt{background:var(--high);color:var(--text);box-shadow:none;border:1px solid var(--line);font-size:18px;min-height:52px}
.cta.alt:active{transform:none;background:var(--top)}
.cta svg{font-size:22px}

/* live */

.players{padding:10px 14px 0;display:flex;flex-direction:column;gap:6px}
.pl{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:12px 14px;opacity:.85}
.pl.active{opacity:1;border:2px solid var(--brass);box-shadow:0 0 16px rgba(229,169,60,.25),0 4px 0 #000;padding:11px 13px}
.pl .row1{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.pl .nm{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
.pl .nm i{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:none}
.pl.active .nm{color:var(--text)}
.pl.active .nm i{background:var(--brass);box-shadow:0 0 8px var(--brass)}
.pl .nm em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .tag{position:absolute;top:-9px;right:12px;background:var(--brass);color:var(--ink);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:2px 9px;border-radius:99px}
.pl:not(.active){display:flex;align-items:center;gap:10px;padding:7px 12px}
.pl:not(.active) .nm{flex:1;font-size:19px}
.pl:not(.active) .stats{padding:3px 8px}
.pl .lg{font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--brass);background:var(--low);border:1px solid var(--line);border-radius:7px;padding:2px 6px;margin-left:2px;flex:none}
.pl .wait{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.chip{display:flex;align-items:center;gap:6px;background:var(--brass);color:var(--ink);padding:4px 9px;border-radius:9px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.chip svg{font-size:13px}
.pl .row2{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.pl .sc{font-family:var(--display);font-size:clamp(28px,8.4vw,34px);line-height:1.05;color:var(--muted);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.pl.active .sc{font-size:clamp(46px,min(15vw,9dvh),66px);line-height:1;color:var(--brass)}
.stats{display:flex;align-items:center;background:var(--low);border:1px solid var(--line);border-radius:12px;padding:5px 10px;gap:10px}
.stats div{display:flex;flex-direction:column;align-items:center;min-width:34px}
.stats span{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats b{font-size:16px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.pl:not(.active) .stats b{color:var(--muted);font-size:14px}
.stats u{width:1px;height:24px;background:var(--line)}
.stats .hi{color:var(--brass)}
@media (max-width:520px){.pl:not(.active) .stats .x{display:none}}

.visit{margin:8px 14px 0;display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:8px}
.visit .vt{display:flex;flex-direction:column;flex:0 0 62px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.3;padding-left:4px}
.visit .vt b{color:var(--text);font-size:11px}
.slot{flex:1;min-height:50px;border-radius:12px;border:1px dashed var(--line);background:var(--low);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.slot small{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--dim)}
.slot b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;color:var(--dim)}
.slot.f{border:1px solid var(--brass);background:var(--high)}
.slot.f b{color:var(--text)}
.slot.nx{border:1px solid rgba(229,169,60,.6);background:var(--green-bg)}
.slot.bust{border-color:var(--red);background:#2b1210}
.slot.bust b{color:#ff8a7d}
.tot{flex:0 0 62px;min-height:50px;border-radius:12px;background:var(--brass);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center}
.tot small{font-size:9px;font-weight:800;letter-spacing:.1em}
.tot b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05}
.tot.bust{background:var(--red);color:#fff}
.tot.bust b{font-size:20px}

.mult{margin:8px 14px 0;display:flex;background:var(--low);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.mult button{flex:1;min-height:40px;border-radius:10px;font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.mult button.on{background:var(--brass);color:var(--ink)}
.mult button.on.t{background:var(--brass-hi)}

.pad{margin:8px 14px 0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,minmax(var(--padh),1fr)) minmax(calc(var(--padh) + 6px),1.1fr);gap:8px;flex:1}
.pad button{min-height:0;padding:0;line-height:1;border-radius:12px;background:var(--surf);border:1px solid var(--line);font-family:var(--display);font-size:28px;color:var(--text);transition:transform .05s}
.pad button:active:not(:disabled){background:var(--brass);color:var(--ink);transform:translateY(2px)}
.pad .sp{grid-column:span 1}
.pad .wide{grid-column:span 5;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0;padding:0;border:0;background:none;min-height:0}
.pad .wide button{height:100%}
.pad .wide button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;line-height:1.05;font-size:clamp(22px,4.6dvh,28px)}
.pad .wide button small{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;opacity:.8}
.k25,.kbull{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important}
.kmiss{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}
.pad .wide button:active:not(:disabled){filter:brightness(1.25);transform:translateY(2px)}

.acts{margin:8px 14px 0;display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.acts .cta{min-height:50px;font-size:22px}
.acts .cta.alt{font-size:22px;min-height:50px;border:1px solid var(--line)}

/* toast */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%) translateY(-120px);background:var(--red);color:#fff;font-family:var(--display);font-size:24px;letter-spacing:.06em;padding:8px 22px;border-radius:99px;z-index:60;transition:transform .2s;text-transform:uppercase;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--brass);color:var(--ink)}

/* winner */
.win{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
.win .in{max-width:var(--pw);margin:0 auto;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.hero{position:relative;overflow:hidden;background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:22px 14px 14px;text-align:center;margin-bottom:12px}
.hero:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--brass),var(--green))}
.medal{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:var(--high);display:grid;place-items:center;color:var(--brass);font-size:42px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--low);border:1px solid var(--line);color:var(--brass);padding:6px 12px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.hero h2{margin:8px 0 8px;font-family:var(--display);font-weight:400;font-size:clamp(40px,15vw,64px);line-height:1;color:var(--brass);text-transform:uppercase;letter-spacing:.02em;word-break:break-word}
.hero .sub{display:inline-block;background:var(--low);border-radius:10px;padding:7px 16px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.res{display:grid;gap:8px;margin-top:14px}
.res .r{display:flex;align-items:center;gap:10px;background:var(--high);border-radius:14px;padding:10px 12px;text-align:left}
.res .r .b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-family:var(--display);font-size:18px;flex:none}
.res .r.w .b{background:var(--brass);color:var(--ink)}
.res .r .n{flex:1;min-width:0;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .r .n small{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.res .r.w .n small{color:var(--green)}
.res .r .c{font-family:var(--display);font-size:30px;color:var(--muted)}
.res .r.w .c{color:var(--brass)}
.perf h3{margin:0;font-family:var(--display);font-weight:400;font-size:28px;text-transform:uppercase;letter-spacing:.02em}
.hco{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--low);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0 8px}
.hco .chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.hco .chips i{font-style:normal;background:var(--green-bg);border:1px solid var(--green);color:var(--green);font-size:12px;font-weight:800;padding:2px 8px;border-radius:7px}
.hco .v{font-family:var(--display);font-size:clamp(38px,13vw,52px);line-height:1;color:var(--brass);text-align:right}
.hco .v small{display:block;font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--green)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--low);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .v{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.tile .v b{font-family:var(--display);font-weight:400;font-size:clamp(30px,10vw,38px);line-height:1;color:var(--brass)}
.tile .v span{font-size:12px;font-weight:600;color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--bg);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);border-radius:9px}
.winacts{display:grid;gap:8px;margin-top:12px}
.ghost{background:none;border:0;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}

/* history */
#history,#detail{width:100%;max-width:var(--pw);margin:0 auto}
.hlist{display:flex;flex-direction:column;gap:8px}
.hitem{width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:block}
.hitem:active{background:var(--high)}
.hitem .r1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hitem .mode{color:var(--brass)}
.hitem .r2{display:flex;align-items:center;gap:10px;margin:8px 0 4px;flex-wrap:wrap}
.hitem .pn{display:flex;align-items:baseline;gap:6px;font-family:var(--display);font-size:22px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);min-width:0}
.hitem .pn b{font-weight:400;font-size:26px}
.hitem .pn.w{color:var(--text)}.hitem .pn.w b{color:var(--brass)}
.hitem .pn em{font-style:normal;max-width:9ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hitem .vs{color:var(--dim);font-size:12px;font-weight:700}
.hitem .r3{font-size:12px;color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:15px;line-height:1.5}
.empty .big{font-size:44px;display:block;margin-bottom:8px}
.dpl{background:var(--low);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.dpl .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dpl .h b{font-family:var(--display);font-weight:400;font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.dpl.w .h b{color:var(--brass)}
.dpl .g5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px;text-align:center}
.dpl .g5 span{display:block;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dpl .g5 b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;color:var(--text)}
.vl{display:flex;flex-direction:column;gap:4px}
.vr,.vh{display:grid;grid-template-columns:28px minmax(0,1fr) auto 44px 44px;align-items:center;gap:8px;padding:6px 8px;border-radius:10px}
.vh{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:0;padding-bottom:2px}
.vh span:nth-child(n+3),.vr span:nth-child(n+4){text-align:right}
.vr .dd{justify-content:flex-end}
.vr{background:var(--low);font-size:13px}
.vr .rn{font-family:var(--display);color:var(--dim);font-size:15px}
.vr .pn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vr .dd{display:flex;gap:4px;flex-wrap:wrap}
.vr .dd i{font-style:normal;font-family:var(--display);font-size:14px;letter-spacing:.03em;background:var(--high);border-radius:6px;padding:1px 6px;color:var(--text)}
.vr .vs{font-family:var(--display);font-size:18px;color:var(--brass)}
.vr .rm{font-family:var(--display);font-size:18px;color:var(--muted)}
.vr.bust{background:#2b1210}.vr.bust .vs{color:#ff8a7d;font-size:13px;font-family:var(--sans);font-weight:800}
.vr.co{background:var(--green-bg);box-shadow:inset 0 0 0 1px var(--green)}.vr.co .rm{color:var(--green)}
.danger{color:#ff8a7d}

/* ===== Responsive ===== */
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* very narrow phones (iPhone SE 1st gen, small Androids, split view) */
@media (max-width:359px){
  .wrap,.players{padding-left:10px;padding-right:10px}
  .visit,.mult,.pad,.acts{margin-left:10px;margin-right:10px}
  .visit .vt{display:none}
  .tot{flex-basis:54px}
  .stats{gap:6px;padding:5px 7px}.stats u{display:none}.stats div{min-width:30px}
  .pl .wait{display:none}
  .chip{font-size:11px;padding:3px 7px}
  .pad{gap:6px}.pad button{font-size:24px}
}

/* portrait tablets / large phones in portrait */
@media (min-width:600px) and (orientation:portrait){
  :root{--pw:620px;--padh:44px}
  .pad button{font-size:32px}
  .slot b{font-size:30px}
  .pl .nm{font-size:26px}
  .stats b{font-size:18px}
}

/* short portrait viewports (iPhone SE, Safari with toolbars, split screen) */
@media (orientation:portrait) and (max-height:760px){
  .hdr{padding-top:calc(env(safe-area-inset-top) + 6px);padding-bottom:6px}
  .hdr .ht small{margin-top:1px}
  .players{padding-top:8px;gap:5px}
  .pl{padding:8px 12px}.pl.active{padding:7px 11px}
  .pl.active .sc{font-size:clamp(38px,min(13vw,7.4dvh),54px)}
  .pl:not(.active){padding:4px 12px}
  .pl:not(.active) .sc{font-size:clamp(24px,7vw,30px)}
  .pl .nm{font-size:19px}
  .visit{margin-top:6px;padding:6px}.slot,.tot{min-height:42px}.slot b{font-size:20px}.tot b{font-size:22px}
  .mult{margin-top:6px}.mult button{min-height:36px;font-size:20px}
  .pad{margin-top:6px;gap:6px}
  .acts{margin-top:6px}.acts .cta{min-height:44px;font-size:20px}
  body{padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}
}

@media (orientation:portrait) and (max-height:620px){
  :root{--padh:27px}
  .hdr h1{font-size:22px}
  .pl.active .sc{font-size:clamp(34px,min(12vw,7dvh),46px)}
  .pl:not(.active){padding:3px 12px}
  .pl:not(.active) .stats{display:none}
  .mult button{min-height:32px;font-size:18px}
  .slot,.tot{min-height:38px!important}
  .acts .cta{min-height:40px;font-size:18px}
}
/* 3-4 players: inactive rows show only name + score + average on short screens */
@media (max-height:760px){.players.many .pl:not(.active) .stats{display:none}}

/* landscape: two columns (scoreboard left, keypad right) */
@media (min-width:640px) and (orientation:landscape){
  :root{--pw:1100px;--padh:36px}
  #detail .twocol{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:12px;align-items:start}
  .board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 6px;align-items:stretch}
  .col-b .mult{margin-top:12px}
  .pl.active .sc{font-size:clamp(60px,13dvh,104px)}
  .pl .sc{font-size:clamp(34px,7dvh,52px)}
  #setup{grid-template-columns:repeat(2,minmax(0,1fr))}
  #setup>.two,#setup>#rosterCard,#setup>#startBtn{grid-column:span 2}
  #setup>#startBtn{max-width:520px;width:100%;justify-self:center}
  #winBody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  #winBody>.hero,#winBody>.card{margin:0}
  #history .hlist{display:grid;grid-template-columns:1fr 1fr}
  #winBody>.winacts{grid-column:span 2;max-width:520px;width:100%;justify-self:center}
}

@media (orientation:landscape) and (max-width:900px){.pl:not(.active) .stats .x{display:none}}

/* short landscape (phones on their side): compact everything */
@media (orientation:landscape) and (max-height:560px){
  .hdr .ht{display:flex;align-items:baseline;gap:10px;justify-content:center}.hdr .ht small{margin:0}
  body{padding-bottom:calc(env(safe-area-inset-bottom) + 6px)}
  :root{--padh:30px}
  .hdr{padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:4px}
  .hdr h1{font-size:22px}.hdr .ic{height:34px}
  .players{padding-top:8px;gap:6px}
  .pl{padding:8px 12px}.pl.active{padding:7px 11px}
  .pl.active .sc{font-size:clamp(46px,15dvh,64px)}
  .pl .sc{font-size:clamp(26px,8dvh,34px)}
  .pl .nm{font-size:18px}
  .stats{padding:3px 8px}.stats b{font-size:14px}
  .visit{margin-top:8px;padding:6px}.slot,.tot{min-height:44px}.slot b{font-size:20px}.tot b{font-size:22px}
  .col-b .mult{margin-top:8px}.mult button{min-height:38px;font-size:19px}
  .pad{margin-top:8px;gap:6px}.pad button{font-size:22px;border-radius:10px}
  .pad .wide{gap:6px}.pad .wide button{font-size:22px;min-height:calc(var(--padh) + 2px)}.pad .wide button small{display:none}
  .acts{margin-top:8px}.acts .cta{min-height:44px;font-size:19px}
  .hero{padding-top:14px}.medal{width:56px;height:56px;font-size:30px;margin-bottom:6px}
  .toast{top:calc(env(safe-area-inset-top) + 50px);font-size:20px}
}

@media (orientation:landscape) and (max-height:400px){:root{--padh:24px}.hdr{padding-top:calc(env(safe-area-inset-top) + 2px);padding-bottom:2px}.hdr .ic{height:30px}.hdr h1{font-size:20px}.pl:not(.active) .stats{display:none}body{padding-bottom:calc(env(safe-area-inset-bottom) + 2px)}.acts .cta{min-height:38px}.slot,.tot{min-height:38px!important}.col-b .mult{margin-top:6px}.mult button{min-height:34px}}

/* big screens / desktop: scale the whole UI a bit */
@media (min-width:1100px) and (min-height:760px){
  :root{--pw:1180px}
  html{font-size:112%}
}

<body>

<header class="hdr">
  <button class="ic" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
  <div class="ht"><h1 id="hdrTitle">Match Setup</h1><small id="hdrSub"></small></div>
  <span class="sp"><button class="nb" id="histBtn">History</button><button class="nb" id="newBtn">New game</button></span>
</header>

<!-- SETUP -->
<main id="setup" class="wrap">
  <div class="card">
    <div class="t"><b><svg viewBox="0 0 24 24"><path d="M4 22V4M4 4h13l-2 4 2 4H4"/></svg>Game mode</b><span>Standard legs</span></div>
    <div class="seg" id="modeSeg"><button data-v="301">301</button><button data-v="501" class="on">501</button><button data-v="701">701</button></div>
  </div>

  <div class="card">
    <div class="t"><b><svg viewBox="0 0 24 24"><path d="M4 22V4M4 4h13l-2 4 2 4H4"/></svg>Checkout rule</b><span class="g">Official PDC rule</span></div>
    <div class="seg" id="outSeg"><button data-v="double" class="on">Double-Out</button><button data-v="straight">Straight-Out</button></div>
  </div>

  <div class="two" style="margin-bottom:12px">
    <div class="card">
      <div class="t"><b><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>Legs to win</b></div>
      <div class="seg" id="legSeg"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3" class="on">3</button><button data-v="5">5</button></div>
    </div>
    <div class="card">
      <div class="t"><b><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2.5.7 4 2.5 4 6"/></svg>Players</b></div>
      <div class="seg" id="plSeg"><button data-v="1">1</button><button data-v="2" class="on">2</button><button data-v="3">3</button><button data-v="4">4</button></div>
    </div>
  </div>

  <div class="card" id="rosterCard">
    <div class="t"><b><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Throw order &amp; roster</b><button class="swap" id="swapBtn"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 4L3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg>Swap</button></div>
    <div class="roster" id="roster"></div>
  </div>

  <button class="cta" id="startBtn"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M7 4l13 8-13 8z"/></svg>Start game</button>
</main>

<!-- LIVE -->
<main id="game" class="hidden">
  <div class="board">
  <div class="col-a">
  <div class="players" id="players"></div>
  <div class="visit" id="visit"></div>
  </div>
  <div class="col-b">
  <div class="mult" id="mult">
    <button data-m="1" class="on">Single</button>
    <button data-m="2">Double</button>
    <button data-m="3">Triple</button>
  </div>
  <div class="pad" id="pad"></div>
  <div class="acts">
    <button class="cta alt" id="undoBtn"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Undo</button>
    <button class="cta" id="skipBtn">End visit<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
  </div>
  </div>
</main>

<!-- HISTORY -->
<main id="history" class="wrap hidden"></main>
<!-- MATCH DETAIL / LOG -->
<main id="detail" class="wrap hidden"></main>

<!-- WINNER -->
<div class="win hidden" id="win"><div class="in"><div class="hdr" style="position:static;justify-content:center"><h1>Match Over</h1></div><div class="wrap" id="winBody"></div></div></div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const KEY = 'dartcounter.v2';
  const ICON = {
    flag: '<svg viewBox="0 0 24 24"><path d="M4 22V4M4 4h13l-2 4 2 4H4"/></svg>',
    trophy: '<svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>',
    undo: '<svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
    play: '<svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M7 4l13 8-13 8z"/></svg>'
  };
  let cfg = { start: 501, out: 'double', legs: 3, count: 2, names: ['Yathu', 'Mamfred', 'Player 3', 'Player 4'] };
  let G = null, undoStack = [], mult = 1, timer = null;

  /* ---------- helpers ---------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const later = (fn, ms) => { clearTimeout(timer); timer = setTimeout(() => { timer = null; fn(); }, ms); };
  const label = d => d.n === 0 ? 'Miss' : d.n === 25 ? (d.m === 2 ? 'Bull' : '25') : ['', 'S', 'D', 'T'][d.m] + d.n;
  const visitSum = () => G.visit.reduce((a, d) => a + d.v, 0);
  const avg = p => p.darts ? (p.pts / p.darts * 3).toFixed(1) : '–';

  /* ---------- setup ---------- */
  function seg(id, key, parse = v => v) {
    $(id).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      cfg[key] = parse(b.dataset.v);
      if (key === 'count') renderRoster();
    });
  }
  const syncSeg = (id, v) => $(id).querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === String(v)));
  seg('#modeSeg', 'start', Number); seg('#outSeg', 'out'); seg('#legSeg', 'legs', Number); seg('#plSeg', 'count', Number);

  const ORD = ['First throw', 'Second throw', 'Third throw', 'Fourth throw'];
  function renderRoster() {
    const r = $('#roster'); r.innerHTML = '';
    for (let i = 0; i < cfg.count; i++) {
      const row = document.createElement('div'); row.className = 'rrow';
      row.innerHTML = '<div class="b">P' + (i + 1) + '</div><div class="fl"><input maxlength="14" placeholder="Player ' + (i + 1) + '" aria-label="Player ' + (i + 1) + ' name"><small>' + ORD[i] + '</small></div>';
      const inp = row.querySelector('input'); inp.value = cfg.names[i];
      inp.addEventListener('input', () => cfg.names[i] = inp.value);
      r.appendChild(row);
    }
    $('#swapBtn').classList.toggle('hidden', cfg.count < 2);
  }
  $('#swapBtn').addEventListener('click', () => {
    const a = cfg.names.slice(0, cfg.count); a.push(a.shift());
    cfg.names.splice(0, cfg.count, ...a); renderRoster();
  });

  /* ---------- match history ---------- */
  const HKEY = 'dartcounter.history.v1';
  let view = 'setup', detailFrom = 'history', detailId = null;
  const loadHist = () => { try { const a = JSON.parse(localStorage.getItem(HKEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
  const saveHist = a => { try { localStorage.setItem(HKEY, JSON.stringify(a.slice(0, 50))); } catch (e) {} };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  function saveMatch() {
    const e = {
      id: G.id, ts: Date.now(), start: G.start, out: G.out, legsToWin: G.legsToWin, winner: G.winner,
      players: G.players.map(p => ({ name: p.name, legs: p.legs, avg: avg(p), best: p.best, n180: p.n180, darts: p.darts, hiCo: p.hiCo, hiCoPath: p.hiCoPath })),
      log: G.log
    };
    saveHist([e, ...loadHist().filter(x => x.id !== e.id)]);
  }
  const dropMatch = id => saveHist(loadHist().filter(x => x.id !== id));
  const fmtDate = ts => { try { return new Date(ts).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return new Date(ts).toLocaleString(); } };

  /* ---------- persistence ---------- */
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ cfg, G, undoStack })); } catch (e) {} }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (!s) return false;
      cfg = Object.assign(cfg, s.cfg); G = s.G; undoStack = s.undoStack || [];
      if (G) { G.log = G.log || []; G.id = G.id || newId(); }
      return !!G;
    } catch (e) { return false; }
  }

  /* ---------- game logic ---------- */
  function newGame() {
    const names = cfg.names.slice(0, cfg.count).map((n, i) => n.trim() || 'Player ' + (i + 1));
    G = {
      start: cfg.start, out: cfg.out, legsToWin: cfg.legs,
      players: names.map(n => ({ name: n, score: cfg.start, legs: 0, pts: 0, darts: 0, best: 0, n180: 0, hiCo: 0, hiCoPath: [] })),
      leg: 1, starter: 0, cur: 0, visit: [], visitBust: false, locked: false, over: false, winner: null,
      id: newId(), log: []
    };
    undoStack = []; clearTimeout(timer); timer = null;
    setMult(1); save(); show('game');
  }
  const snapshot = () => { undoStack.push(JSON.stringify(G)); if (undoStack.length > 400) undoStack.shift(); };

  function throwDart(n, m) {
    if (G.over || G.visitBust || G.locked || G.visit.length >= 3) return;
    snapshot();
    const p = G.players[G.cur], v = n * m;
    const before = p.score - visitSum(), rem = before - v;
    G.visit.push({ n, m, v }); p.darts++;
    let bust = false, win = false;
    if (G.out === 'double') {
      if (rem < 0 || rem === 1) bust = true;
      else if (rem === 0) { if (m === 2) win = true; else bust = true; }
    } else if (rem < 0) bust = true; else if (rem === 0) win = true;

    if (bust) { G.visitBust = true; toast('Bust', false); render(); save(); later(endVisit, 1000); return; }
    if (win) {
      const s = visitSum();
      if (p.score > p.hiCo) { p.hiCo = p.score; p.hiCoPath = G.visit.map(label); }
      p.pts += s; p.best = Math.max(p.best, s); if (s === 180) p.n180++;
      G.log.push({ l: G.leg, p: G.cur, d: G.visit.map(label), s, b: 0, r: 0, co: 1 });
      p.score = 0; legWon(); return;
    }
    if (G.visit.length === 3) { G.locked = true; render(); save(); later(endVisit, 450); return; }
    setMult(1); render(); save();
  }

  function endVisit() {
    const p = G.players[G.cur];
    if (!G.visitBust) {
      const s = visitSum(); p.score -= s; p.pts += s; p.best = Math.max(p.best, s);
      if (s === 180) { p.n180++; toast('180!', true); }
    }
    G.log.push({ l: G.leg, p: G.cur, d: G.visit.map(label), s: G.visitBust ? 0 : visitSum(), b: G.visitBust ? 1 : 0, r: p.score, co: 0 });
    G.visit = []; G.visitBust = false; G.locked = false;
    G.cur = (G.cur + 1) % G.players.length;
    setMult(1); render(); save();
  }

  function legWon() {
    const p = G.players[G.cur]; p.legs++; G.locked = true;
    if (p.legs >= G.legsToWin) { G.over = true; G.winner = G.cur; saveMatch(); render(); save(); show('win'); return; }
    toast(p.name + ' takes the leg', true); render(); save();
    later(() => {
      G.players.forEach(x => x.score = G.start);
      G.leg++; G.starter = (G.starter + 1) % G.players.length; G.cur = G.starter;
      G.visit = []; G.visitBust = false; G.locked = false;
      render(); save();
    }, 1500);
  }

  function undo() {
    if (!undoStack.length) return;
    clearTimeout(timer); timer = null;
    const wasOver = G.over, oldId = G.id;
    G = JSON.parse(undoStack.pop());
    if (wasOver && !G.over) dropMatch(oldId);
    G.locked = false;
    setMult(1); show('game'); save();
  }

  function endVisitEarly() {
    if (G.over || G.visitBust || G.locked) return;
    snapshot();
    const p = G.players[G.cur];
    while (G.visit.length < 3) { G.visit.push({ n: 0, m: 1, v: 0 }); p.darts++; }
    endVisit();
  }

  /* ---------- checkout finder ---------- */
  const SEGS = [];
  for (let n = 20; n >= 1; n--) SEGS.push({ l: 'T' + n, v: n * 3, d: false });
  SEGS.push({ l: 'Bull', v: 50, d: true });
  for (let n = 20; n >= 1; n--) SEGS.push({ l: 'D' + n, v: n * 2, d: true });
  for (let n = 20; n >= 1; n--) SEGS.push({ l: 'S' + n, v: n, d: false });
  SEGS.push({ l: '25', v: 25, d: false });
  const cache = {};
  function checkout(rem, darts, dbl) {
    const key = rem + '|' + darts + '|' + dbl;
    if (key in cache) return cache[key];
    const fin = dbl ? SEGS.filter(s => s.d) : SEGS; let res = null;
    out: for (let k = 1; k <= darts; k++) {
      if (k === 1) { for (const f of fin) if (f.v === rem) { res = [f.l]; break out; } }
      else if (k === 2) { for (const a of SEGS) { const r = rem - a.v; if (r <= 0) continue; for (const f of fin) if (f.v === r) { res = [a.l, f.l]; break out; } } }
      else { for (const a of SEGS) { const r1 = rem - a.v; if (r1 <= 0) continue; for (const b of SEGS) { const r2 = r1 - b.v; if (r2 <= 0) continue; for (const f of fin) if (f.v === r2) { res = [a.l, b.l, f.l]; break out; } } } }
    }
    return cache[key] = res;
  }

  /* ---------- rendering ---------- */
  function setMult(m) {
    mult = m;
    $('#mult').querySelectorAll('button').forEach(b => b.classList.toggle('on', Number(b.dataset.m) === m));
    $('#mult [data-m="3"]').classList.toggle('t', true);
    const k = $('.k25'); if (k) k.disabled = m === 3 || (G && (G.over || G.visitBust || G.locked));
  }

  function render() {
    if (!G) return;
    $('#hdrTitle').textContent = G.start + ' · ' + (G.out === 'double' ? 'Double-Out' : 'Straight-Out');
    $('#hdrSub').textContent = 'Leg ' + G.leg + (G.legsToWin > 1 ? ' · First to ' + G.legsToWin : '');
    const sum = visitSum(), many = G.players.length > 2;
    const box = $('#players'); box.innerHTML = ''; box.classList.toggle('many', many);
    G.players.forEach((p, i) => {
      const act = i === G.cur && !G.over;
      const live = act && !G.visitBust ? p.score - sum : p.score;
      let chip = '';
      if (act && !G.visitBust && live > 0 && live <= 170) {
        const c = checkout(live, 3 - G.visit.length, G.out === 'double');
        if (c) chip = '<div class="chip">' + ICON.flag + 'Checkout: ' + c.join(' · ') + '</div>';
      }
      const el = document.createElement('div');
      el.className = 'pl' + (act ? ' active' : '');
      const lg = G.legsToWin > 1 ? '<span class="lg">LEGS ' + p.legs + '</span>' : '';
      const stats = '<div class="stats"><div><span>3-Dart Ø</span><b>' + avg(p) + '</b></div><u class="x"></u><div class="x"><span>Best</span><b>' + p.best + '</b></div><u class="x"></u><div class="x"><span>180s</span><b class="hi">' + p.n180 + '</b></div></div>';
      el.innerHTML = act
        ? '<span class="tag">Throwing</span><div class="row1"><div class="nm"><i></i><em>' + esc(p.name) + '</em>' + lg + '</div>' + chip + '</div><div class="row2"><div class="sc">' + live + '</div>' + stats + '</div>'
        : '<div class="nm"><i></i><em>' + esc(p.name) + '</em>' + lg + '</div><div class="sc">' + live + '</div>' + stats;
      box.appendChild(el);
    });

    const v = $('#visit');
    let h = '<div class="vt">Visit ' + (Math.floor(G.players[G.cur].darts / 3) + 1) + '<b>Turn score</b></div>';
    for (let i = 0; i < 3; i++) {
      const d = G.visit[i];
      const cls = d ? ('f' + (G.visitBust ? ' bust' : '')) : (i === G.visit.length && !G.locked ? 'nx' : '');
      h += '<div class="slot ' + cls + '"><small>D' + (i + 1) + '</small><b>' + (d ? label(d) : '–') + '</b></div>';
    }
    h += '<div class="tot' + (G.visitBust ? ' bust' : '') + '"><small>TOTAL</small><b>' + (G.visitBust ? 'BUST' : sum) + '</b></div>';
    v.innerHTML = h;

    const dis = G.over || G.visitBust || G.locked;
    $('#pad').querySelectorAll('button').forEach(b => b.disabled = dis);
    $('#mult').querySelectorAll('button').forEach(b => b.disabled = dis);
    $('#skipBtn').disabled = dis;
    $('#undoBtn').disabled = !undoStack.length;
    const k = $('.k25'); if (k) k.disabled = dis || mult === 3;
  }

  function buildPad() {
    const pad = $('#pad'); let h = '';
    for (let n = 1; n <= 20; n++) h += '<button data-n="' + n + '">' + n + '</button>';
    h += '<div class="wide">' +
      '<button class="k25" data-n="25">25<small>OUTER</small></button>' +
      '<button class="kbull" data-n="bull">BULL<small>50 PTS</small></button>' +
      '<button class="kmiss" data-n="0">MISS<small>0 PTS</small></button></div>';
    pad.innerHTML = h;
  }

  /* winner screen */
  function renderWin() {
    const w = G.players[G.winner];
    const others = G.players.filter((_, i) => i !== G.winner).sort((a, b) => b.legs - a.legs || a.score - b.score);
    const opp = others[0];
    const sorted = G.players.map((p, i) => ({ p, i })).sort((a, b) => b.p.legs - a.p.legs || a.p.score - b.p.score);
    const pct = (a, b) => Math.max(8, Math.min(100, b ? a / Math.max(a, b) * 100 : 100));
    const wa = Number(avg(w)) || 0, oa = opp ? Number(avg(opp)) || 0 : 0;
    const rows = sorted.map(({ p, i }) =>
      '<div class="r' + (i === G.winner ? ' w' : '') + '"><div class="b">' + esc(p.name.charAt(0).toUpperCase()) + '</div>' +
      '<div class="n">' + esc(p.name) + '<small>' + (i === G.winner ? 'Winner' : 'Runner-up') + ' · ' + p.legs + (p.legs === 1 ? ' leg' : ' legs') + '</small></div>' +
      '<div class="c">' + p.legs + '</div></div>').join('');
    const oppTxt = (v) => opp ? '<span>Opp. ' + v + '</span>' : '';
    $('#winBody').innerHTML =
      '<div class="hero"><div class="medal">' + ICON.trophy + '</div>' +
      '<span class="pill">' + ICON.flag.replace('<svg', '<svg style="font-size:14px"') + 'Match decider</span>' +
      '<h2>' + esc(w.name) + ' wins!</h2>' +
      '<span class="sub">' + (opp ? 'Match won ' + w.legs + ' – ' + opp.legs + ' in legs' : 'Game shot') + '</span>' +
      '<div class="res">' + rows + '</div></div>' +
      '<div class="card perf"><h3>Match performance</h3>' +
      '<div class="hco"><div><div class="lbl">Highest checkout</div><div class="chips">' + (w.hiCoPath.length ? w.hiCoPath.map(x => '<i>' + esc(x) + '</i>').join('') : '') + '</div></div>' +
      '<div class="v">' + (w.hiCo || '–') + '<small>' + (w.hiCo ? 'Checked out' : '') + '</small></div></div>' +
      '<div class="grid">' +
      '<div class="tile"><div class="lbl">3-Dart average</div><div class="v"><b>' + avg(w) + '</b>' + oppTxt(avg(opp || w)) + '</div><div class="bar"><i style="width:' + pct(wa, oa) + '%"></i></div></div>' +
      '<div class="tile"><div class="lbl">Best turn score</div><div class="v"><b>' + w.best + '</b>' + oppTxt(opp ? opp.best : 0) + '</div><div class="bar"><i style="width:' + pct(w.best, opp ? opp.best : 0) + '%"></i></div></div>' +
      '<div class="tile"><div class="lbl">Maximums (180)</div><div class="v"><b>' + w.n180 + '</b>' + oppTxt(opp ? opp.n180 : 0) + '</div></div>' +
      '<div class="tile"><div class="lbl">Total darts</div><div class="v"><b>' + w.darts + '</b>' + oppTxt(opp ? opp.darts : 0) + '</div></div>' +
      '</div></div>' +
      '<div class="winacts"><button class="cta" id="rematchBtn">' + ICON.play + 'New match / Rematch</button>' +
      '<button class="cta alt" id="logBtn">Full log</button>' +
      '<button class="ghost" id="winUndo">' + ICON.undo.replace('<svg', '<svg style="font-size:16px"') + 'Undo final winning dart (resume leg)</button></div>';
    $('#rematchBtn').onclick = () => { cfg.names.splice(0, G.players.length, ...G.players.map(p => p.name)); newGame(); };
    $('#winUndo').onclick = undo;
    $('#logBtn').onclick = () => openDetail(G.id, 'win');
  }

  let tt;
  function toast(msg, ok) {
    const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (ok ? ' ok' : '');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1300);
  }

  /* keep the screen on during a match (where supported) */
  let wl = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch (e) {}
  }
  function sleepOk() { try { if (wl) { wl.release(); wl = null; } } catch (e) {} }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && G && !G.over && !$('#game').classList.contains('hidden')) keepAwake();
  });

  /* history list */
  function renderHistory() {
    const h = loadHist(), box = $('#history');
    if (!h.length) {
      box.innerHTML = '<div class="empty"><span class="big">🎯</span>No matches yet.<br>Finished matches show up here, including a throw-by-throw log.</div>';
      return;
    }
    box.innerHTML = '<div class="hlist">' + h.map(e => {
      const pls = e.players.map((p, i) => '<span class="pn' + (i === e.winner ? ' w' : '') + '"><em>' + esc(p.name) + '</em><b>' + p.legs + '</b></span>').join('<span class="vs">:</span>');
      const w = e.players[e.winner];
      return '<button class="hitem" data-id="' + esc(e.id) + '"><div class="r1"><span>' + esc(fmtDate(e.ts)) + '</span><span class="mode">' + e.start + ' · ' + (e.out === 'double' ? 'Double-Out' : 'Straight-Out') + '</span></div>' +
        '<div class="r2">' + pls + '</div><div class="r3">' + esc(w.name) + ' won · Ø ' + w.avg + ' · best ' + w.best + (w.hiCo ? ' · checkout ' + w.hiCo : '') + '</div></button>';
    }).join('') + '</div><button class="ghost danger" id="clearHist">Clear all history</button>';
  }

  /* single match: summary + visit log */
  function renderDetail() {
    const e = loadHist().find(x => x.id === detailId), box = $('#detail');
    if (!e) { box.innerHTML = '<div class="empty">This match is no longer available.</div>'; return; }
    const sorted = e.players.map((p, i) => ({ p, i })).sort((a, b) => b.p.legs - a.p.legs);
    const sum = sorted.map(({ p, i }) =>
      '<div class="dpl' + (i === e.winner ? ' w' : '') + '"><div class="h"><b>' + esc(p.name) + '</b><span class="lbl">' + (i === e.winner ? 'Winner · ' : '') + p.legs + (p.legs === 1 ? ' leg' : ' legs') + '</span></div>' +
      '<div class="g5"><div><span>3-Dart Ø</span><b>' + p.avg + '</b></div><div><span>Best</span><b>' + p.best + '</b></div><div><span>180s</span><b>' + p.n180 + '</b></div><div><span>Darts</span><b>' + p.darts + '</b></div><div><span>Hi-CO</span><b>' + (p.hiCo || '–') + '</b></div></div></div>').join('');
    const legs = [...new Set(e.log.map(v => v.l))];
    const n = e.players.length;
    const logHtml = legs.map(l => {
      const vs = e.log.filter(v => v.l === l);
      const won = vs.find(v => v.co);
      const rows = vs.map((v, i) =>
        '<div class="vr' + (v.b ? ' bust' : '') + (v.co ? ' co' : '') + '"><span class="rn">' + (Math.floor(i / n) + 1) + '</span><span class="pn">' + esc(e.players[v.p].name) + '</span>' +
        '<span class="dd">' + v.d.map(x => '<i>' + esc(x) + '</i>').join('') + '</span><span class="vs">' + (v.b ? 'BUST' : v.s) + '</span><span class="rm">' + v.r + '</span></div>').join('');
      return '<div class="card"><div class="t"><b>Leg ' + l + '</b><span class="g">' + (won ? esc(e.players[won.p].name) + ' · ' + (won.d.length) + ' dart finish' : 'unfinished') + '</span></div>' +
        '<div class="vl"><div class="vh"><span>#</span><span>Player</span><span>Darts</span><span>Pts</span><span>Left</span></div>' + rows + '</div></div>';
    }).join('');
    box.innerHTML = '<div class="twocol"><div><div class="card"><div class="t"><b>' + ICON.trophy + 'Result</b><span>' + e.start + ' · ' + (e.out === 'double' ? 'Double-Out' : 'Straight-Out') + (e.legsToWin > 1 ? ' · First to ' + e.legsToWin : '') + '</span></div>' + sum + '</div>' +
      (detailFrom === 'history' ? '<button class="ghost danger" id="delMatch">Delete this match</button>' : '') + '</div><div>' + logHtml + '</div></div>';
  }
  function openDetail(id, from) { detailId = id; detailFrom = from; show('detail'); }

  function show(which) {
    view = which;
    $('#setup').classList.toggle('hidden', which !== 'setup');
    $('#game').classList.toggle('hidden', !(which === 'game' || which === 'win'));
    $('#win').classList.toggle('hidden', which !== 'win');
    $('#history').classList.toggle('hidden', which !== 'history');
    $('#detail').classList.toggle('hidden', which !== 'detail');
    $('#newBtn').style.display = which === 'game' ? '' : 'none';
    $('#histBtn').style.display = which === 'setup' ? '' : 'none';
    if (which !== 'game') {
      $('#hdrTitle').textContent = { setup: 'Match Setup', win: 'Match Over', history: 'History', detail: 'Match Log' }[which];
      $('#hdrSub').textContent = which === 'history' ? (loadHist().length + (loadHist().length === 1 ? ' match' : ' matches')) : '';
    }
    $('#backBtn').style.visibility = which === 'setup' ? 'hidden' : 'visible';
    if (which === 'game') keepAwake(); else sleepOk();
    if (which === 'setup') {
      syncSeg('#modeSeg', cfg.start); syncSeg('#outSeg', cfg.out); syncSeg('#legSeg', cfg.legs); syncSeg('#plSeg', cfg.count); renderRoster();
    } else if (which === 'history') { renderHistory(); window.scrollTo(0, 0); }
    else if (which === 'detail') {
      renderDetail(); window.scrollTo(0, 0);
      const e = loadHist().find(x => x.id === detailId); if (e) $('#hdrSub').textContent = fmtDate(e.ts);
    } else { render(); if (which === 'win') renderWin(); }
  }

  /* ---------- events ---------- */
  $('#mult').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled) setMult(Number(b.dataset.m)); });
  $('#pad').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const n = b.dataset.n;
    if (n === 'bull') return throwDart(25, 2);
    const num = Number(n);
    if (num === 0) return throwDart(0, 1);
    throwDart(num, num === 25 ? Math.min(mult, 2) : mult);
  });
  $('#undoBtn').addEventListener('click', undo);
  $('#skipBtn').addEventListener('click', endVisitEarly);
  const leave = () => {
    if (G && !G.over && !confirm('Discard the running match and go back to setup?')) return;
    G = null; undoStack = []; clearTimeout(timer); save(); show('setup');
  };
  $('#newBtn').addEventListener('click', leave);
  $('#backBtn').addEventListener('click', () => {
    if (view === 'history') show('setup');
    else if (view === 'detail') show(detailFrom === 'win' ? 'win' : 'history');
    else leave();
  });
  $('#histBtn').addEventListener('click', () => show('history'));
  $('#history').addEventListener('click', e => {
    const it = e.target.closest('.hitem'); if (it) return openDetail(it.dataset.id, 'history');
    if (e.target.closest('#clearHist') && confirm('Delete the complete match history?')) { saveHist([]); renderHistory(); $('#hdrSub').textContent = '0 matches'; }
  });
  $('#detail').addEventListener('click', e => {
    if (e.target.closest('#delMatch') && confirm('Delete this match from the history?')) { dropMatch(detailId); show('history'); }
  });
  $('#startBtn').addEventListener('click', newGame);

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});

  buildPad();
  if (load()) {
    if (G.locked && !G.over) {   // reload mid-animation: finish the pending step
      G.locked = false;
      if (G.visitBust || G.visit.length >= 3) endVisit();
      else if (G.players.some(p => p.score === 0)) {
        G.players.forEach(x => x.score = G.start); G.leg++; G.starter = (G.starter + 1) % G.players.length; G.cur = G.starter; G.visit = [];
      }
    }
    show(G.over ? 'win' : 'game');
  } else show('setup');
})();
</script>
</body>
</html>
