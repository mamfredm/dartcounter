<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110a">
<title>Dart-Zähler</title>
<style>
@font-face{font-family:'Bungee';src:url('bungee.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
:root{
  --sans:'Avenir Next','Helvetica Neue',Arial,sans-serif;
  --display:'Bungee','Avenir Next','Helvetica Neue',Arial,sans-serif;
  --bg:#14110a; --card:#1f1b11; --card2:#2a2517; --line:#3a3320;
  --text:#f6f1e3; --muted:#a79f86; --accent:#fcba01; --accent-ink:#1a1400;
  --good:#5ec26a; --bad:#ef5b4c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}
body{min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);max-width:560px;margin:0 auto}
h1{font-family:var(--display);font-weight:400;font-size:1.5rem;letter-spacing:.02em;margin:20px 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}

/* Setup */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.panel h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:600}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:12px 8px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.names input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;margin-bottom:8px}
.names input:focus{outline:2px solid var(--accent);outline-offset:1px}
.primary{font-family:var(--display);font-weight:400;letter-spacing:.03em;width:100%;padding:16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1.05rem}
.ghost{padding:10px 14px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:.9rem}

/* Game */
.top{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.top .info{color:var(--muted);font-size:.85rem}
.players{display:grid;gap:10px;margin-bottom:12px}
.players.n3,.players.n4{grid-template-columns:1fr 1fr}
.pl{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;position:relative;transition:border-color .15s}
.pl.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(252,186,1,.15)}
.pl .name{font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pl .legs{font-size:.8rem;color:var(--muted);font-weight:600}
.pl .score{font-family:var(--display);font-size:3.2rem;font-weight:400;line-height:1.05;font-variant-numeric:tabular-nums}
.players.n3 .score,.players.n4 .score{font-size:2.4rem}
.pl .stats{display:flex;gap:12px;color:var(--muted);font-size:.78rem;margin-top:4px;flex-wrap:wrap}
.pl .co{margin-top:6px;font-size:.85rem;color:var(--accent);font-weight:700;min-height:1.2em}
.pl .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:none}
.pl.active .dot{display:inline-block}

.visit{display:flex;gap:8px;margin-bottom:12px}
.visit .d{flex:1;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px;text-align:center;font-weight:700;min-height:48px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.visit .d.filled{border-style:solid;border-color:var(--accent)}
.visit .d.bust{border-color:var(--bad);color:var(--bad)}
.visit .tot{font-family:var(--display);font-weight:400;flex:0 0 74px;background:var(--accent);color:var(--accent-ink);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem}

.mult{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.mult button{padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700}
.mult button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pad button{font-family:var(--display);font-weight:400;padding:14px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:1.05rem}
.pad button:active{background:var(--accent);color:var(--accent-ink)}
.pad button.miss{background:#2c1a17;border-color:#4b2a25;color:#ffb3a9}
.pad button.bull{background:#17281a;border-color:#244a2a;color:#a9e6b3}
.pad button:disabled,.mult button:disabled{opacity:.3}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{flex:1}

.toast{font-family:var(--display);font-weight:400;position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%) translateY(-80px);background:var(--bad);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;transition:transform .2s;z-index:10}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--good);color:#06240b}

.overlay{position:fixed;inset:0;background:rgba(10,8,3,.88);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay .box{background:var(--card);border:1px solid var(--accent);border-radius:20px;padding:22px;max-width:420px;width:100%;text-align:center}
.overlay h2{font-family:var(--display);font-weight:400;margin:0 0 6px;font-size:1.6rem}
.overlay table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.9rem}
.overlay td,.overlay th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.overlay td:first-child,.overlay th:first-child{text-align:left}
.overlay th{color:var(--muted);font-weight:600;font-size:.75rem}
.overlay .row{display:flex;gap:8px}
.overlay .row button{flex:1}
</style>
</head>
<body>

<section id="setup">
  <h1>🎯 Dart-Zähler</h1>
  <p class="sub">Spiel einrichten und los geht’s.</p>

  <div class="panel">
    <h2>Spielmodus</h2>
    <div class="seg" id="modeSeg">
      <button data-v="301">301</button>
      <button data-v="501" class="on">501</button>
      <button data-v="701">701</button>
    </div>
  </div>

  <div class="panel">
    <h2>Checkout</h2>
    <div class="seg" id="outSeg">
      <button data-v="double" class="on">Double-Out</button>
      <button data-v="straight">Straight-Out</button>
    </div>
  </div>

  <div class="panel">
    <h2>Gewinne (First to)</h2>
    <div class="seg" id="legSeg">
      <button data-v="1" class="on">1 Leg</button>
      <button data-v="2">2 Legs</button>
      <button data-v="3">3 Legs</button>
      <button data-v="5">5 Legs</button>
    </div>
  </div>

  <div class="panel">
    <h2>Spieler</h2>
    <div class="seg" id="plSeg" style="margin-bottom:12px">
      <button data-v="1">1</button>
      <button data-v="2" class="on">2</button>
      <button data-v="3">3</button>
      <button data-v="4">4</button>
    </div>
    <div class="names" id="names"></div>
  </div>

  <button class="primary" id="startBtn">Spiel starten</button>
</section>

<section id="game" class="hidden">
  <div class="top">
    <div class="info" id="gameInfo"></div>
    <button class="ghost" id="menuBtn">Neues Spiel</button>
  </div>
  <div class="players" id="players"></div>

  <div class="visit" id="visit"></div>

  <div class="mult" id="mult">
    <button data-m="1" class="on">Single</button>
    <button data-m="2">Double</button>
    <button data-m="3">Triple</button>
  </div>
  <div class="pad" id="pad"></div>

  <div class="actions">
    <button class="ghost" id="undoBtn">↶ Zurück</button>
    <button class="ghost" id="skipBtn">Aufnahme beenden</button>
  </div>
</section>

<div class="toast" id="toast"></div>
<div class="overlay hidden" id="overlay"><div class="box" id="overlayBox"></div></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const KEY = 'dartzaehler.v1';
  let cfg = { start: 501, out: 'double', legs: 1, count: 2, names: ['Spieler 1','Spieler 2','Spieler 3','Spieler 4'] };
  let G = null;       // game state
  let undoStack = [];
  let mult = 1;

  /* ---------- Setup UI ---------- */
  function seg(id, key, parse = v => v) {
    const el = $(id);
    el.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      cfg[key] = parse(b.dataset.v);
      if (key === 'count') renderNames();
    });
  }
  function syncSeg(id, val) {
    $(id).querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === String(val)));
  }
  function renderNames() {
    $('#names').innerHTML = '';
    for (let i = 0; i < cfg.count; i++) {
      const inp = document.createElement('input');
      inp.value = cfg.names[i]; inp.placeholder = 'Spieler ' + (i + 1); inp.maxLength = 16;
      inp.addEventListener('input', () => cfg.names[i] = inp.value);
      $('#names').appendChild(inp);
    }
  }
  seg('#modeSeg', 'start', Number);
  seg('#outSeg', 'out');
  seg('#legSeg', 'legs', Number);
  seg('#plSeg', 'count', Number);

  /* ---------- Persistence ---------- */
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ cfg, G, undoStack })); } catch (e) {}
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!s) return false;
      cfg = Object.assign(cfg, s.cfg);
      G = s.G; undoStack = s.undoStack || [];
      return true;
    } catch (e) { return false; }
  }

  /* ---------- Game logic ---------- */
  function newGame() {
    const names = cfg.names.slice(0, cfg.count).map((n, i) => n.trim() || 'Spieler ' + (i + 1));
    G = {
      start: cfg.start, out: cfg.out, legsToWin: cfg.legs,
      players: names.map(n => ({ name: n, score: cfg.start, legs: 0, pts: 0, darts: 0, best: 0, n180: 0 })),
      leg: 1, starter: 0, cur: 0,
      visit: [],           // darts in current visit: {m, n, v}
      visitBust: false,
      over: false, winner: null
    };
    undoStack = [];
    mult = 1; setMult(1);
    save(); showGame();
  }

  function snapshot() { undoStack.push(JSON.stringify(G)); if (undoStack.length > 300) undoStack.shift(); }

  function visitSum() { return G.visit.reduce((a, d) => a + d.v, 0); }

  function throwDart(n, m) {
    if (G.over || G.visitBust) return;
    if (n === 25 && m === 3) return;
    snapshot();
    const p = G.players[G.cur];
    const v = n * m;
    const dart = { n, m, v };
    const before = p.score - visitSum();
    const rem = before - v;
    G.visit.push(dart);
    p.darts++;
    const isDouble = m === 2;
    let bust = false, win = false;
    if (G.out === 'double') {
      if (rem < 0 || rem === 1) bust = true;
      else if (rem === 0) { if (isDouble) win = true; else bust = true; }
    } else {
      if (rem < 0) bust = true; else if (rem === 0) win = true;
    }
    if (bust) {
      G.visitBust = true;
      toast('BUST', false);
      render(); save();
      setTimeout(() => endVisit(), 900);
      return;
    }
    if (win) {
      p.score = 0; p.pts += visitSum();
      p.best = Math.max(p.best, visitSum());
      legWon(); return;
    }
    if (G.visit.length === 3) { render(); save(); setTimeout(() => endVisit(), 350); return; }
    mult = 1; setMult(1);
    render(); save();
  }

  function endVisit() {
    const p = G.players[G.cur];
    if (!G.visitBust) {
      const s = visitSum();
      p.score -= s; p.pts += s;
      p.best = Math.max(p.best, s);
      if (s === 180) { p.n180++; toast('ONE HUNDRED AND EIGHTY!', true); }
    }
    G.visit = []; G.visitBust = false;
    G.cur = (G.cur + 1) % G.players.length;
    mult = 1; setMult(1);
    render(); save();
  }

  function legWon() {
    const p = G.players[G.cur];
    p.legs++;
    if (p.legs >= G.legsToWin) {
      G.over = true; G.winner = G.cur;
      render(); save(); showResult(true);
      return;
    }
    toast(p.name + ' gewinnt das Leg!', true);
    render(); save();
    setTimeout(() => {
      snapshot();
      G.players.forEach(x => x.score = G.start);
      G.leg++; G.starter = (G.starter + 1) % G.players.length; G.cur = G.starter;
      G.visit = []; G.visitBust = false;
      render(); save();
    }, 1400);
  }

  function undo() {
    if (!undoStack.length) return;
    G = JSON.parse(undoStack.pop());
    $('#overlay').classList.add('hidden');
    mult = 1; setMult(1);
    render(); save();
  }

  function skipVisit() {
    if (G.over || G.visitBust) return;
    snapshot();
    // fill remaining darts with misses for stats
    const p = G.players[G.cur];
    while (G.visit.length < 3) { G.visit.push({ n: 0, m: 1, v: 0 }); p.darts++; }
    endVisit();
  }

  /* ---------- Checkout suggestions ---------- */
  const SEGS = [];
  for (let n = 20; n >= 1; n--) { SEGS.push({ l: 'T' + n, v: n * 3, d: false }); }
  SEGS.push({ l: 'Bull', v: 50, d: true });
  for (let n = 20; n >= 1; n--) { SEGS.push({ l: 'D' + n, v: n * 2, d: true }); }
  for (let n = 20; n >= 1; n--) { SEGS.push({ l: 'S' + n, v: n, d: false }); }
  SEGS.push({ l: '25', v: 25, d: false });
  const FINISH = SEGS.filter(s => G_isFinish(s));
  function G_isFinish(s) { return s.d; }

  const coCache = {};
  function checkout(rem, darts, dbl) {
    const key = rem + '|' + darts + '|' + dbl;
    if (key in coCache) return coCache[key];
    let res = null;
    const fin = dbl ? SEGS.filter(s => s.d) : SEGS;
    outer:
    for (let k = 1; k <= darts; k++) {
      if (k === 1) {
        for (const f of fin) if (f.v === rem) { res = [f.l]; break outer; }
      } else if (k === 2) {
        for (const a of SEGS) { const r = rem - a.v; if (r <= 0) continue;
          for (const f of fin) if (f.v === r) { res = [a.l, f.l]; break outer; } }
      } else {
        for (const a of SEGS) { const r1 = rem - a.v; if (r1 <= 0) continue;
          for (const b of SEGS) { const r2 = r1 - b.v; if (r2 <= 0) continue;
            for (const f of fin) if (f.v === r2) { res = [a.l, b.l, f.l]; break outer; } } }
      }
    }
    return coCache[key] = res;
  }

  /* ---------- Rendering ---------- */
  function avg(p) { return p.darts ? (p.pts / p.darts * 3).toFixed(1) : '–'; }

  function render() {
    if (!G) return;
    const el = $('#players');
    el.className = 'players n' + G.players.length;
    el.innerHTML = '';
    const sumNow = visitSum();
    G.players.forEach((p, i) => {
      const active = i === G.cur && !G.over;
      const live = active ? (G.visitBust ? p.score : p.score - sumNow) : p.score;
      let co = '';
      if (active && !G.visitBust) {
        const left = 3 - G.visit.length;
        if (live > 0 && live <= 170) {
          const c = checkout(live, left, G.out === 'double');
          if (c) co = '🎯 ' + c.join(' · ');
        }
      }
      const d = document.createElement('div');
      d.className = 'pl' + (active ? ' active' : '');
      d.innerHTML =
        '<div class="name"><span><span class="dot"></span> ' + esc(p.name) + '</span>' +
        (G.legsToWin > 1 ? '<span class="legs">Legs ' + p.legs + '</span>' : '') + '</div>' +
        '<div class="score">' + live + '</div>' +
        '<div class="stats"><span>Ø ' + avg(p) + '</span><span>Best ' + p.best + '</span><span>180er ' + p.n180 + '</span></div>' +
        '<div class="co">' + co + '</div>';
      el.appendChild(d);
    });

    const v = $('#visit'); v.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const d = G.visit[i];
      const b = document.createElement('div');
      b.className = 'd' + (d ? ' filled' : '') + (d && G.visitBust ? ' bust' : '');
      b.textContent = d ? label(d) : '–';
      v.appendChild(b);
    }
    const t = document.createElement('div'); t.className = 'tot';
    t.textContent = G.visitBust ? 'BUST' : sumNow; v.appendChild(t);

    $('#gameInfo').textContent = G.start + ' · ' + (G.out === 'double' ? 'Double-Out' : 'Straight-Out') +
      (G.legsToWin > 1 ? ' · First to ' + G.legsToWin + ' · Leg ' + G.leg : '');
    const dis = G.over || G.visitBust;
    $('#pad').querySelectorAll('button').forEach(b => b.disabled = dis);
    $('#mult').querySelectorAll('button').forEach(b => b.disabled = dis);
    // Bull: triple nicht möglich
    updateBull();
    $('#undoBtn').disabled = !undoStack.length;
  }

  function label(d) {
    if (d.n === 0) return 'Miss';
    if (d.n === 25) return d.m === 2 ? 'Bull' : '25';
    return ['', 'S', 'D', 'T'][d.m] + d.n;
  }
  function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function buildPad() {
    const pad = $('#pad'); pad.innerHTML = '';
    for (let n = 1; n <= 20; n++) {
      const b = document.createElement('button'); b.textContent = n; b.dataset.n = n; pad.appendChild(b);
    }
    const bull = document.createElement('button'); bull.textContent = '25'; bull.className = 'bull'; bull.dataset.n = 25; pad.appendChild(bull);
    const bb = document.createElement('button'); bb.textContent = 'Bull'; bb.className = 'bull'; bb.dataset.n = 'bull'; pad.appendChild(bb);
    const miss = document.createElement('button'); miss.textContent = 'Miss'; miss.className = 'miss'; miss.dataset.n = 0; pad.style.gridTemplateColumns = 'repeat(5,1fr)'; pad.appendChild(miss);
  }
  function updateBull() {
    const b25 = $('#pad button[data-n="25"]'); if (b25) b25.disabled = b25.disabled || mult === 3;
  }
  function setMult(m) {
    mult = m;
    $('#mult').querySelectorAll('button').forEach(b => b.classList.toggle('on', Number(b.dataset.m) === m));
    updateBull();
  }

  $('#mult').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    setMult(Number(b.dataset.m));
  });
  $('#pad').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const n = b.dataset.n;
    if (n === 'bull') { throwDart(25, 2); return; }
    const num = Number(n);
    if (num === 0) { throwDart(0, 1); return; }
    throwDart(num, num === 25 ? Math.min(mult, 2) : mult);
  });
  $('#undoBtn').addEventListener('click', undo);
  $('#skipBtn').addEventListener('click', skipVisit);
  $('#menuBtn').addEventListener('click', () => {
    if (G && !G.over && !confirm('Laufendes Spiel verwerfen und neues einrichten?')) return;
    G = null; undoStack = []; save(); showSetup();
  });
  $('#startBtn').addEventListener('click', newGame);

  /* ---------- Overlay / Result ---------- */
  function showResult() {
    const w = G.players[G.winner];
    let rows = G.players.map(p =>
      '<tr><td>' + esc(p.name) + '</td><td>' + p.legs + '</td><td>' + avg(p) + '</td><td>' + p.best + '</td><td>' + p.n180 + '</td></tr>').join('');
    $('#overlayBox').innerHTML =
      '<div style="font-size:2.6rem">🏆</div><h2>' + esc(w.name) + ' gewinnt!</h2>' +
      '<table><tr><th>Spieler</th><th>Legs</th><th>Ø/3 Darts</th><th>Best</th><th>180er</th></tr>' + rows + '</table>' +
      '<div class="row"><button class="ghost" id="ovUndo">↶ Letzten Wurf zurück</button><button class="primary" id="ovNew" style="padding:12px">Neues Spiel</button></div>';
    $('#overlay').classList.remove('hidden');
    $('#ovUndo').onclick = undo;
    $('#ovNew').onclick = () => { $('#overlay').classList.add('hidden'); newGame(); };
  }

  let tt;
  function toast(msg, ok) {
    const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (ok ? ' ok' : '');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1300);
  }

  function showSetup() {
    $('#game').classList.add('hidden'); $('#setup').classList.remove('hidden');
    syncSeg('#modeSeg', cfg.start); syncSeg('#outSeg', cfg.out); syncSeg('#legSeg', cfg.legs); syncSeg('#plSeg', cfg.count);
    renderNames();
  }
  function showGame() {
    $('#setup').classList.add('hidden'); $('#game').classList.remove('hidden');
    render(); if (G.over) showResult();
  }

  /* ---------- Init ---------- */
  buildPad();
  if (load() && G) showGame(); else showSetup();
})();
</script>
</body>
</html>
